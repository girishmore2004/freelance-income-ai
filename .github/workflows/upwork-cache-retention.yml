name: Upwork API cache retention

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expire-upwork-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-retention.txt
      - name: Install minimal retention dependencies
        run: python -m pip install -r backend/requirements-retention.txt
      - name: Redact expired Upwork listing cache
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            # Retention is only required once Upwork data can be stored; then a missing database URL must fail.
            if [ -n "$UPWORK_CLIENT_ID" ]; then
              echo "Missing PRODUCTION_DATABASE_URL repository secret while the Upwork integration is configured" >&2
              exit 1
            fi
            echo "::notice::Upwork integration is not configured and PRODUCTION_DATABASE_URL is not set; no Upwork cache to expire. Skipping."
            exit 0
          fi
          python -m app.retention_cleanup
