name: Scheduled Upwork saved searches

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-due-saved-searches:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run due read-only searches
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          ENVIRONMENT: production
          OAUTH_ENCRYPTION_KEY: ${{ secrets.OAUTH_ENCRYPTION_KEY }}
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
          UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_CLIENT_SECRET }}
          UPWORK_REDIRECT_URI: ${{ secrets.UPWORK_REDIRECT_URI }}
          UPWORK_SCOPES: ${{ secrets.UPWORK_SCOPES }}
          UPWORK_CACHE_RETENTION_ENABLED: ${{ vars.UPWORK_CACHE_RETENTION_ENABLED }}
        run: |
          for key in DATABASE_URL OAUTH_ENCRYPTION_KEY UPWORK_CLIENT_ID UPWORK_CLIENT_SECRET UPWORK_REDIRECT_URI UPWORK_SCOPES; do
            if [ -z "${!key}" ]; then echo "Missing required secret: $key" >&2; exit 1; fi
          done
          python -m app.scheduled_discovery
