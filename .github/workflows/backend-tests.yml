name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fia
          POSTGRES_PASSWORD: fia_test_password
          POSTGRES_DB: fia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fia -d fia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://fia:fia_test_password@localhost:5432/fia_test
      TEST_DATABASE_URL: postgresql+psycopg://fia:fia_test_password@localhost:5432/fia_test
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15
      ENVIRONMENT: test
      PUBLIC_REGISTRATION: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify PostgreSQL and Redis
        run: |
          python - <<'PY'
          import os
          import psycopg
          import redis

          database_url = os.environ["DATABASE_URL"].replace(
              "postgresql+psycopg://",
              "postgresql://",
          )

          with psycopg.connect(database_url) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT 1")
                  assert cursor.fetchone()[0] == 1

          client = redis.Redis.from_url(os.environ["REDIS_URL"])
          assert client.ping()

          print("PostgreSQL and Redis are available.")
          PY
          
      - name: Validate Alembic revision identifiers
        working-directory: backend
        run: python scripts/check_migration_ids.py
        
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -q
