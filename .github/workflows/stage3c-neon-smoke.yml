
name: Stage 3C - Neon Read-Only Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage3c-neon-smoke-test
  cancel-in-progress: false

jobs:
  neon-smoke-test:
    name: Validate Neon PostgreSQL connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EXPECTED_DATABASE: neondb
      EXPECTED_SCHEMA: public
      EXPECTED_NEON_HOST: ${{ vars.STAGE3C_EXPECTED_NEON_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Neon endpoint and database identity
        env:
          STAGE3C_DATABASE_URL: ${{ secrets.STAGE3C_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import (
              parse_qsl,
              urlencode,
              urlsplit,
              urlunsplit,
          )

          import psycopg

          raw = os.environ.get("STAGE3C_DATABASE_URL", "").strip()

          if not raw:
              sys.exit("STAGE3C_DATABASE_URL secret is missing.")

          parsed = urlsplit(raw)

          expected_host = (
              os.environ.get("EXPECTED_NEON_HOST", "")
              .strip()
              .lower()
              .rstrip(".")
          )
          actual_host = (parsed.hostname or "").lower().rstrip(".")

          if not expected_host:
              sys.exit("STAGE3C_EXPECTED_NEON_HOST variable is missing.")

          if parsed.scheme not in ("postgres", "postgresql"):
              sys.exit("Only PostgreSQL connection URLs are accepted.")

          if actual_host != expected_host:
              sys.exit("Neon hostname does not match the approved test endpoint.")

          if not actual_host.endswith(".neon.tech"):
              sys.exit("The configured endpoint is not a Neon hostname.")

          database_name = parsed.path.lstrip("/").split("/", 1)[0]

          if database_name != os.environ["EXPECTED_DATABASE"]:
              sys.exit("Unexpected database name.")

          if not parsed.username or not parsed.password:
              sys.exit("Database credentials are missing.")

          query = dict(parse_qsl(parsed.query, keep_blank_values=True))
          query["sslmode"] = "require"

          sqlalchemy_url = urlunsplit((
              "postgresql+psycopg",
              parsed.netloc,
              parsed.path,
              urlencode(query),
              "",
          ))

          psycopg_url = urlunsplit((
              "postgresql",
              parsed.netloc,
              parsed.path,
              urlencode(query),
              "",
          ))

          try:
              with psycopg.connect(
                  psycopg_url,
                  connect_timeout=20,
                  options="-c default_transaction_read_only=on",
              ) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("""
                          SELECT current_database(), current_schema(),
                                 current_setting('transaction_read_only')
                      """)

                      database, schema, read_only = cursor.fetchone()

                      if database != os.environ["EXPECTED_DATABASE"]:
                          sys.exit("Connected to an unexpected database.")

                      if schema != os.environ["EXPECTED_SCHEMA"]:
                          sys.exit("Connected to an unexpected schema.")

                      if read_only != "on":
                          sys.exit("Database connection is not read-only.")

                      cursor.execute("SELECT 1")
                      if cursor.fetchone()[0] != 1:
                          sys.exit("PostgreSQL SELECT 1 check failed.")

          except SystemExit:
              raise
          except Exception:
              sys.exit(
                  "Neon connection verification failed. "
                  "Inspect configuration without exposing credentials."
              )

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"TEST_DATABASE_URL={sqlalchemy_url}\n")

          print("Neon endpoint verified.")
          print(f"Database: {database_name}")
          print(f"Schema: {os.environ['EXPECTED_SCHEMA']}")
          print("Connection: read-only.")
          print("Credentials were not printed.")
          PY

      - name: Run read-only PostgreSQL smoke test
        working-directory: backend
        run: |
          pytest -q \
            tests/test_integration_services_v27.py::test_postgres_connection_and_transaction_rollback
