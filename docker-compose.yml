services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: freelance
      POSTGRES_PASSWORD: freelance_dev_password
      POSTGRES_DB: freelance_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelance -d freelance_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://freelance:freelance_dev_password@db:5432/freelance_ai
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://freelance:freelance_dev_password@db:5432/freelance_ai
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://freelance:freelance_dev_password@db:5432/freelance_ai
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
